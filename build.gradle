plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = "${mod_id}-fabric-${minecraft_version}"
}

// Any third party mod jar this project needs lives in libs/ so the build never
// has to reach a remote maven repository for content mods.
def localMod = { String name -> files("libs/${name}") }

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [
			version          : project.mod_version,
			minecraft_version: project.minecraft_version,
			mod_id           : project.mod_id,
			mod_name         : project.mod_name,
			mod_description  : project.mod_description,
			mod_authors      : project.mod_authors,
			mod_license      : project.mod_license
	]
	inputs.properties props

	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
