# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
minecraft_version=1.21.1
loader_version=0.19.5
# The Loom line the other local Fabric builds use; it needs a Java 25 build JVM
# (see gradle/gradle-daemon-jvm.properties). The mod itself targets Java 21.
loom_version=1.18-SNAPSHOT

# Mod Properties
mod_id=wstweaksfabric
mod_name=Wither Skeleton Tweaks Fabric
mod_description=Turns all Skeletons in the Nether into Wither Skeletons, adds Skull Fragments and the Immolation Blade. Fabric port of Wither Skeleton Tweaks by Shadows_of_Fire, with the Placebo library replaced by a local implementation.
mod_authors=FromtheArakiel
mod_license=MIT
mod_version=1.0.0
maven_group=dev.arakiel.wstweaksfabric

# Dependencies
fabric_api_version=0.116.17+1.21.1
